<script>
var URLS={g:"https://www.google.com/search?q=",d:"https://duckduckgo.com/?q=",y:"https://www.youtube.com/results?search_query=",w:"https://en.wikipedia.org/w/index.php?search="};
var eng="g";
var q=document.getElementById("q");
function run(text){
  var t=(text||q.value).trim();
  if(!t){q.focus();return;}
  var u=URLS[eng]+encodeURIComponent(t);
  var w=null;
  try{w=window.open(u,"_blank","noopener");}catch(e){}
  if(!w){try{window.top.location.href=u;}catch(e){window.location.href=u;}}
}
document.getElementById("go").addEventListener("click",function(){run();});
q.addEventListener("keydown",function(e){if(e.key==="Enter")run();});
[].forEach.call(document.querySelectorAll(".engines button"),function(b){

  });
});

});
