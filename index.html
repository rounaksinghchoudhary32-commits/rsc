<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RsC - Search for study</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2a6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="RsC is a simple search page to find notes, solutions and videos for exams.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f6f8fc;--surface:#fff;--ink:#14213d;--muted:#56627f;--line:#d5dbe8;--accent:#1b2a6b;--gold:#e8a317;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--surface:#182039;--ink:#e8ecf7;--muted:#9aa5c4;--line:#2a3555;--accent:#f0b429;--gold:#f0b429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1526;--surface:#182039;--ink:#e8ecf7;--muted:#9aa5c4;--line:#2a3555;--accent:#f0b429;--gold:#f0b429;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:18vh 16px 40px;text-align:center}
.logo{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;font-size:3.4rem;letter-spacing:-2px;margin:0 0 4px;color:var(--accent)}
.logo i{font-style:normal;color:var(--gold)}
.tag{color:var(--muted);margin:0 0 24px}
.box{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:4px 6px 4px 18px}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 40%,transparent)}
.box input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:12px 8px;outline:0}
.go{border:0;background:var(--accent);color:var(--bg);font:inherit;font-weight:600;border-radius:24px;padding:10px 20px;cursor:pointer}
.engines{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
.engines button,.chips button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer;min-height:44px}
.engines button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips button{color:var(--muted)}
.count{margin:0 0 20px;font-weight:600;color:var(--accent)}
.timer{margin:26px auto 0;max-width:320px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px}
.timer .t{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;font-size:2.6rem;line-height:1.1}
.timer .r{display:flex;gap:8px;justify-content:center;margin-top:8px}
.timer button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:20px;padding:8px 16px;cursor:pointer;min-height:44px}
.note{color:var(--muted);font-size:.9rem;margin-top:28px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px} 
  :root:root{--bg:#0b0618;--surface:#17102e;--ink:#f3eeff;--muted:#a79bd1;--line:#2d2253;--accent:#8b5cf6;--gold:#22d3ee}
body{background:radial-gradient(circle at 50% 0%,#2a1458 0%,#0b0618 60%) fixed}
.logo{text-shadow:0 0 24px #8b5cf6aa}
.box{background:#ffffff14;backdrop-filter:blur(12px);border-color:#ffffff30;box-shadow:0 8px 32px #8b5cf633}
.go{box-shadow:0 0 16px #8b5cf6aa}
.engines button,.chips button{background:#ffffff0d;border-color:#ffffff25;transition:.2s}
.chips button:hover{transform:translateY(-2px);border-color:var(--gold)}
.timer{background:#ffffff0d;backdrop-filter:blur(10px)}
main{animation:fadein .8s ease}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* RsC MCQ DESIGN */
.gm{
  margin:26px auto;
  max-width:420px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--surface);
  padding:16px;
  text-align:left;
}

.gm .gt{
  font-weight:800;
  font-size:1.3rem;
  text-align:center;
}

.gm .gs{
  color:var(--muted);
  text-align:center;
  margin:8px;
}

.gm .gh{
  display:flex;
  justify-content:space-between;
  font-size:.9rem;
  font-weight:600;
}

.gm .gq{
  font-weight:600;
  margin:18px 0;
}

.gm button{
  width:100%;
  padding:11px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid var(--line);
  background:#ffffff0d;
  color:var(--ink);
  font:inherit;
}

.gm button.ok{
  background:#16a34a;
  color:white;
}

.gm button.bad{
  background:#dc2626;
  color:white;
}

.gm #next{
  background:var(--accent);
  color:white;
}
  </style>
</head>
<body>
<main>
  <h1 class="logo">Rs<i>C</i></h1>
  <p class="tag">Find notes, solutions and videos for your exam.</p>
  <p class="count" id="cd"></p>
  <div class="box">
    <input id="q" type="text" aria-label="Search" placeholder="What do you want to study?" autocomplete="off">
    <button class="go" id="go">Search</button>
  </div>
  <div class="engines" role="group" aria-label="Search with">
    <button data-e="g" aria-pressed="true">Google</button>
    <button data-e="d" aria-pressed="false">DuckDuckGo</button>
    <button data-e="y" aria-pressed="false">YouTube</button>
    <button data-e="w" aria-pressed="false">Wikipedia</button>
  </div>
  <div class="chips" id="chips">
    <button>Class 10 sample papers</button>
    <button>Class 10 Maths formulas</button>
    <button>Class 10 Science important questions</button>
    <button>Class 10 previous year papers</button>
  </div> 

  <div class="timer"><div class="t" id="tm">25:00</div><div class="meta">Focus timer</div><div class="r"><button id="ts">Start</button><button id="tr">Reset</button></div></div>
  <p class="note">Results open on the search engine you choose.</p>
  <div class="gm" id="quiz">

  <div class="gt">RsC Class 10 MCQ</div>
  <div class="gs">CBSE Board Practice</div>

  <div class="gh">
    <span id="progress">Question 1</span>
    <span id="score">Score: 0</span>
  </div>

  <div class="gq" id="question"></div>

  <div id="options"></div>

  <button id="next" onclick="nextQuestion()">
    Next Question →
  </button>

  <div class="gs" id="result"></div>

  </div>
</main>
<script>
var URLS={g:"https://www.google.com/search?q=",d:"https://duckduckgo.com/?q=",y:"https://www.youtube.com/results?search_query=",w:"https://en.wikipedia.org/w/index.php?search="};
var eng="g";
var q=document.getElementById("q");
function run(text){
  var t=(text||q.value).trim();
  if(!t){q.focus();return;}
  var u=URLS[eng]+encodeURIComponent(t);
  var w=null;
  try{w=window.open(u,"_blank","noopener");}catch(e){}
  if(!w){try{window.top.location.href=u;}catch(e){window.location.href=u;}}
}
document.getElementById("go").addEventListener("click",function(){run();});
q.addEventListener("keydown",function(e){if(e.key==="Enter")run();});
[].forEach.call(document.querySelectorAll(".engines button"),function(b){
  b.addEventListener("click",function(){
    eng=b.getAttribute("data-e");
    [].forEach.call(document.querySelectorAll(".engines button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
  });
});
[].forEach.call(document.querySelectorAll("#chips button"),function(b){
  b.addEventListener("click",function(){q.value=b.textContent;run(b.textContent);});
});
q.focus();

(function(){
  var d=new Date(2026,11,10),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var l=Math.round((d-n)/86400000),el=document.getElementById("cd");
  el.textContent="Rounak singh is CEO of this app. Thank for visiting.Meet on 17 February.Bigbrother.com";
  var left=1500,run=null,tm=document.getElementById("tm"),ts=document.getElementById("ts");
  function show(){var m=Math.floor(left/60),s=left%60;tm.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
  ts.addEventListener("click",function(){
    if(run){clearInterval(run);run=null;ts.textContent="Start";return;}
    ts.textContent="Pause";
    run=setInterval(function(){left--;show();if(left<=0){clearInterval(run);run=null;ts.textContent="Start";left=1500;tm.textContent="Time is up. Take a 5 minute break.";}},1000);
  });
  // RsC CLASS 10 QUESTION BANK

const questions = [

{
subject:"Science",
chapter:"Chemical Reactions",
q:"Which gas is released when metals react with acids?",
options:["Oxygen","Hydrogen","Nitrogen","Carbon dioxide"],
answer:1
},

{
subject:"Science",
chapter:"Acids Bases and Salts",
q:"What is the pH value of a neutral solution?",
options:["0","7","10","14"],
answer:1
},

{
subject:"Maths",
chapter:"Real Numbers",
q:"What is the HCF of 12 and 18?",
options:["2","3","6","9"],
answer:2
},

{
subject:"Maths",
chapter:"Quadratic Equations",
q:"What is the discriminant formula?",
options:["b²+4ac","b²-4ac","a²-4bc","b-4ac"],
answer:1
},

{
subject:"Science",
chapter:"Electricity",
q:"What is the SI unit of electric current?",
options:["Volt","Ohm","Ampere","Watt"],
answer:2
},

{
subject:"Social Science",
chapter:"Nationalism in India",
q:"Who led the Dandi March in 1930?",
options:["Nehru","Mahatma Gandhi","Patel","Bose"],
answer:1
},

{
subject:"Biology",
chapter:"Life Processes",
q:"Which organ pumps blood?",
options:["Lungs","Kidney","Heart","Liver"],
answer:2
}

];

let pool=[];
let current=0;
let score=0;
let answered=false;

function shuffle(array){
  return array
    .map(value=>({value,sort:Math.random()}))
    .sort((a,b)=>a.sort-b.sort)
    .map(item=>item.value);
}

function startQuiz(){

  pool=shuffle([...questions]);
  current=0;
  score=0;

  showQuestion();
}

function showQuestion(){

  answered=false;

  if(current>=pool.length){

    document.getElementById("question").textContent=
      "Quiz Completed!";

    document.getElementById("options").innerHTML="";

    document.getElementById("result").textContent=
      "Your Score: "+score+"/"+pool.length;

    document.getElementById("next").textContent=
      "Restart Quiz";

    return;
  }

  let q=pool[current];

  document.getElementById("progress").textContent=
    "Question "+(current+1)+"/"+pool.length;

  document.getElementById("score").textContent=
    "Score: "+score;

  document.getElementById("question").textContent=q.q;

  document.getElementById("options").innerHTML="";

  q.options.forEach((option,index)=>{

    let btn=document.createElement("button");

    btn.textContent=option;

    btn.onclick=()=>checkAnswer(index,btn);

    document.getElementById("options").appendChild(btn);

  });

  document.getElementById("result").textContent="";
  document.getElementById("next").textContent="Next Question →";
}

function checkAnswer(index,btn){

  if(answered)return;

  answered=true;

  let q=pool[current];

  if(index===q.answer){

    score++;

    btn.classList.add("ok");

    document.getElementById("result").textContent=
      "Correct Answer!";

  }else{

    btn.classList.add("bad");

    document.getElementById("result").textContent=
      "Correct Answer: "+q.options[q.answer];
  }

  document.getElementById("score").textContent=
    "Score: "+score;
}
function nextQuestion(){

  if(current >= pool.length){
    startQuiz();
    return;
  }

  current++;

  showQuestion();
}

window.nextQuestion = nextQuestion;
startQuiz();
  document.getElementById("tr").addEventListener("click",function(){clearInterval(run);run=null;left=1500;ts.textContent="Start";show();});
  if("serviceWorker" in navigator){window.addEventListener("load",function(){try{navigator.serviceWorker.register("./sw.js");}catch(e){}});}
})();
</script>
</body>
</html>
